[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fixait"
version = "0.8.0"
description = "Unified global and local fiXAIt explanations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Selman Uzun"}]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
optimizer = ["torch>=2.1"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fixait", "fixait.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
